# Tiny Tapeout project information
project:
  title:        "UNA: 8-bit CPU with triangle GPU"      # Project title
  author:       "YOUR NAME"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit CPU with a built-in triangle rasterizer; program memory is external"      # One line description
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_una_cpu_gpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "ABSOLUTE.v"
    - "ADDSUB.v"
    - "AND_GATE.v"
    - "AND_GATE_3_INPUTS.v"
    - "AND_GATE_BUS.v"
    - "Adder.v"
    - "BRESENY.v"
    - "Bresenham.v"
    - "CNTRL.v"
    - "Comparator.v"
    - "DIVISION.v"
    - "DLY.v"
    - "Decoder_4.v"
    - "Decoder_8.v"
    - "FA.v"
    - "GRAPHICSCARD.v"
    - "HORIZONTAL.v"
    - "LogisimCounter.v"
    - "LogisimRNG.v"
    - "MATH.v"
    - "MULTIPLY.v"
    - "Multiplexer_bus_16.v"
    - "Multiplexer_bus_2.v"
    - "Multiplexer_bus_4.v"
    - "NOR_GATE_8_INPUTS.v"
    - "OR_GATE.v"
    - "OR_GATE_3_INPUTS.v"
    - "OR_GATE_8_INPUTS.v"
    - "OR_GATE_BUS.v"
    - "PLA_PLA_1.v"
    - "RAMCONTENTS_RAM_1.v"
    - "REGISTERS.v"
    - "REGISTER_FLIP_FLOP.v"
    - "SHIFTREG_18_Classic.v"
    - "SHIFTREG_3_Classic.v"
    - "SORTSHIFT.v"
