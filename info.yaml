# Tiny Tapeout project information
project:
  title:        "UNA: 8-bit CPU + triangle GPU"      # Project title
  author:       "TODO your name"                       # Your name
  discord:      ""                                     # Your discord username (optional)
  description:  "8-bit CPU with a hardware triangle-drawing GPU (Bresenham), designed in Logisim-evolution; program memory is external"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000  # 20 MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"            # 4 tiles

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_una_cpu_gpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "una6.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "INPUT[0]"
  ui[1]: "INPUT[1]"
  ui[2]: "INPUT[2]"
  ui[3]: "INPUT[3]"
  ui[4]: "INPUT[4]"
  ui[5]: "INPUT[5]"
  ui[6]: "INPUT[6]"
  ui[7]: "INPUT[7]"

  # Outputs
  uo[0]: "DATAOUT[0]"
  uo[1]: "DATAOUT[1]"
  uo[2]: "DATAOUT[2]"
  uo[3]: "DATAOUT[3]"
  uo[4]: "DATAOUT[4]"
  uo[5]: "DATAOUT[5]"
  uo[6]: "DATAOUT[6]"
  uo[7]: "DATAOUT[7]"

  # Bidirectional pins (all driven as outputs)
  uio[0]: "OUTSIDECONTROL[0]"
  uio[1]: "OUTSIDECONTROL[1]"
  uio[2]: "OUTSIDECONTROL[2]"
  uio[3]: "OUTSIDECONTROL[3]"
  uio[4]: "OUTSIDECONTROL[4]"
  uio[5]: "OUTSIDECONTROL[5]"
  uio[6]: "GPU_X"
  uio[7]: "GPU_Y"

# Do not change!
yaml_version: 6
